name: BütçeApp security smoke checks
on:
  push:
    branches: [feature/installable-pwa]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app and auth safeguards
        run: |
          node tests/security-smoke.mjs
          node tests/cashflow-model.test.mjs
          node tests/cashflow-ui.test.mjs
          node tests/statement-import.test.mjs
          node tests/statement-file-reader.test.mjs
          node tests/statement-cashflow.test.mjs
          node --check statement-plan.js
          node --check statement-ui.js
          node --check statement-file-reader.js
          node --check statement-import.js
