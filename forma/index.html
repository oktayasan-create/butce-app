.auth-panel{width:min(100%,430px);background:white;padding:clamp(22px,5vw,38px);border-radius:26px;box-shadow:0 30px 100px #0006;color:#16232c;display:flex;flex-direction:column;gap:13px}
.auth-mark{background:#b7ef84;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:29px;color:#123026}
.auth-panel h1{font-size:31px;margin:3px 0}.auth-panel h1 span{color:#13897b;font-size:16px}.auth-panel p{line-height:1.6;color:#63747e;margin:0 0 5px}
.auth-panel label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:12px}.auth-panel input{border:1px solid #dce5e6;padding:14px;border-radius:12px;background:#f8faf9;min-width:0;color:#14272f}
.auth-button{width:100%;min-height:44px}.auth-panel small,#authNotice{font-size:12px;line-height:1.5;color:#75878d}
.cloud-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sync-indicator{font-size:10px;color:#247d5a;font-weight:750;max-width:160px;overflow-wrap:anywhere}.sync-error{color:#cb463e}
.cloud-controls .btn{min-height:34px}.theme-settings{padding:20px}.theme-settings h3{margin:0 0 7px}.theme-settings p{color:var(--muted);font-size:12px}.theme-options{display:flex;gap:9px;flex-wrap:wrap}.theme-options button{background:var(--white);color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:750;cursor:pointer}.theme-options button.on{outline:2px solid var(--teal);background:var(--mint)}
html[data-theme="dark"]{--bg:#0d1822;--ink:#eef6f5;--muted:#99afb5;--line:#30434b;--white:#192a35;--dark:#101a24;--teal:#a2e59a;--mint:#2e5649;--lime:#b7ef84;--shadow:0 10px 40px #0003;color-scheme:dark}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] .card,html[data-theme="dark"] .mini-tag,html[data-theme="dark"] .btn-outline,html[data-theme="dark"] .btn-icon{background:var(--white);color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .stat .stat-foot,html[data-theme="dark"] .meal .subtitle,html[data-theme="dark"] .meal-desc,html[data-theme="dark"] .date-switch p,html[data-theme="dark"] .donutcopy p,html[data-theme="dark"] .donut-text small,html[data-theme="dark"] .inputbox label{color:#a5b8be}
html[data-theme="dark"] .meal-stats span,html[data-theme="dark"] .btn-quiet,html[data-theme="dark"] .tag,html[data-theme="dark"] .right-tip{background:#29404b;color:#cde4de}
html[data-theme="dark"] .meal-stats strong,html[data-theme="dark"] .theme-options button{color:var(--ink)}
html[data-theme="dark"] .meal.done,html[data-theme="dark"] .meal.custom{background:#1a3338;border-color:#467a6a}
html[data-theme="dark"] .donut:before{background:var(--white)}
html[data-theme="dark"] .progress,html[data-theme="dark"] .macroline .bar{background:#30434a}
html[data-theme="dark"] .inputbox input,html[data-theme="dark"] .inputbox textarea,html[data-theme="dark"] .inputbox select,html[data-theme="dark"] .setting-line input,html[data-theme="dark"] .portion input{background:#243842;color:#edf8f5;border:1px solid #3a535e}
html[data-theme="dark"] .modal,html[data-theme="dark"] .modal-main,html[data-theme="dark"] .modal-header,html[data-theme="dark"] .modal-foot{background:#192a35;color:#f1f6f5;border-color:#30434b}
html[data-theme="dark"] .source-pill,html[data-theme="dark"] .draftrow,html[data-theme="dark"] .foodrow{background:#233943;color:#dfecea}
html[data-theme="dark"] .hero{background:#163936}
html[data-theme="dark"] .auth-screen{background:#101b25}
html[data-theme="dark"] .auth-panel{background:#182b35;color:#edf8f5}
html[data-theme="dark"] .auth-panel p,html[data-theme="dark"] .auth-panel small,html[data-theme="dark"] #authNotice{color:#a9c3c4}
html[data-theme="dark"] .auth-panel input{background:#253b44;color:white;border-color:#45606b}
html[data-theme="dark"] .theme-options button.on{background:#275343}
html[data-theme="dark"] .btn-primary{background:#b7ef84;color:#17352b}
html[data-theme="dark"] .btn-green{background:#83d5a3;color:#103524}
html[data-theme="dark"] .tag.train{color:#f5c89d;background:#47372b}
html[data-theme="dark"] .mobile-nav{background:#111e29}
.meal-desc,.meal-heading,.meal-head,.draftrow,.modal-main,.inputbox{min-width:0;overflow-wrap:anywhere}
.meal-actions{align-items:stretch}.meal-actions .btn{white-space:normal;text-align:center}
@media(max-width:530px){.main{padding-left:12px;padding-right:12px}.topbar{align-items:flex-start;flex-wrap:wrap}.topactions{flex-wrap:wrap;width:100%}.topactions>.btn{display:none}.cloud-controls{justify-content:space-between;width:100%}.cloud-controls .btn{padding:7px 11px}.auth-screen{align-items:center}.daycell{min-width:0}.daycell .pct{overflow-wrap:anywhere}.cal-grid{gap:3px}.meal .tag{max-width:46%;overflow-wrap:anywhere}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* FORMA v2.1 food-portion input */
.draftrow{grid-template-columns:minmax(0,1fr) minmax(175px,1.7fr) 74px 32px;gap:8px;min-width:0}
.draftrow>div:first-child{min-width:0;overflow-wrap:anywhere}
.quantity-wrap{min-width:0}
.quantity-main{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;min-width:0}
.quantity-main select{min-width:0;max-width:100%;border:1px solid #dfe7e4;border-radius:8px;background:#fff;padding:7px 5px;font-size:12px;text-overflow:ellipsis}
.quantity-main input{min-width:0;padding:7px 5px;font-size:14px}
.gram-conversion{font-size:10px;display:block;margin-top:4px;color:#66837b;white-space:normal}
.custom-unit{display:flex;align-items:center;gap:6px;margin-top:5px}
.custom-unit label{font-size:10px;min-width:85px;white-space:nowrap}
.custom-unit input{width:75px;min-width:0}
.foodsection{background:#eaf5ef;color:#266950;padding:8px 12px;font-size:11px;font-weight:700}
.foodsearch-status{padding:12px;font-size:11px;line-height:1.5;color:#607b79}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:610px){.draftrow{grid-template-columns:minmax(0,1fr) 32px;align-items:start}.draftrow .quantity-wrap{grid-column:1;grid-row:2}.draftrow .nutr{grid-column:1;grid-row:3;text-align:left}.draftrow>button{grid-column:2;grid-row:1}.modal-main{padding:15px}.modal-header{padding:16px}.foodrow{gap:6px}.foodrow>div{min-width:0;overflow-wrap:anywhere}.foodrow .btn{padding-left:8px;padding-right:8px}.quantity-main{grid-template-columns:80px minmax(0,1fr)}.modal{max-height:calc(100dvh - 20px);width:calc(100vw - 12px)}}

const UNIT_HINTS={
 egg:[['adet',50,'adet (≈50 g)',1]],eggwhite:[['adet',33,'adet (≈33 g)',1]],

function unitDefs(food){
 const name=(food?.name||'').toLocaleLowerCase('tr-TR');const key=food?.id||'';
 let def=[{id:'g',g:1,label:'gram (g)',amount:100}];
 let hints=UNIT_HINTS[key]||[];
 if(!hints.length){
  if(/yumurta akı|yumurta beyazı/.test(name))hints=[['adet',33,'adet (≈33 g)',1]];
  else if(/yumurta|egg\b/.test(name))hints=[['adet',50,'adet (≈50 g)',1]];
  else if(/muz\b/.test(name))hints=[['adet',120,'orta boy adet (≈120 g)',1]];
  else if(/elma\b/.test(name))hints=[['adet',150,'orta boy adet (≈150 g)',1]];
  else if(/süt\b|milk\b|ayran|içecek|su\b/.test(name))hints=[['ml',1,'mililitre (ml, yaklaşık)',200]];
  else if(/dilim|ekmek|tost/.test(name))hints=[['dilim',30,'dilim (≈30 g)',1]];
 }
 for(const h of hints)def.push({id:h[0],g:h[1],label:h[2],amount:h[3]});
 if(food?.servingGrams>0)def.push({id:'porsiyon',g:food.servingGrams,label:`ürün porsiyonu (${fmt1(food.servingGrams)} g)`,amount:1});
 def.push({id:'ozel-adet',g:null,label:'adet (1 adedin gramını belirle)',amount:1});
 return def;
}
function unitOf(item){return unitDefs(item).find(u=>u.id===item.unit)||unitDefs(item)[0]}
function fromQuantity(item){const qty=Number(item.qty);const gPer=Number(item.gramsPerUnit);
 if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(gPer)||gPer<=0)return false;
 item.grams=Math.round(qty*gPer*100)/100;return true;
}
function draftItem(food){

 const item={id:food.id,name:food.name,kcal:food.kcal,p:food.p,c:food.c,f:food.f,origin:food.origin,unit:u.id,qty:u.amount,gramsPerUnit:u.g,grams:u.g*u.amount,servingGrams:food.servingGrams||null};

function ensureUnit(item){if(!item.unit){item.unit='g';item.qty=item.grams||100;item.gramsPerUnit=1}
 if(!(Number(item.gramsPerUnit)>0)){const def=unitOf(item);if(def.g>0)item.gramsPerUnit=def.g;}
 if(!(Number(item.qty)>0)){item.qty=(Number(item.grams)||100)/Number(item.gramsPerUnit||1)}
 return item;
}

async function openFoodFactsSearch(query){
 const seq=++remoteSearchSeq;
 if(query.trim().length<3){remoteFoods=[];remoteSearchState='';renderFoodSearchOnly();return}
 remoteSearchState='Markalı ürünler aranıyor…';renderFoodSearchOnly();
 try{
  const url='https://world.openfoodfacts.org/cgi/search.pl?'+new URLSearchParams({search_terms:query,search_simple:'1',action:'process',json:'1',page_size:'12',fields:'code,product_name,brands,nutriments,serving_size'});
  const controller=new AbortController();const stop=setTimeout(()=>controller.abort(),6500);
  let rsp;
  try{rsp=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(stop)}
  if(!rsp.ok)throw Error('Arama servisi yanıt vermedi');
  const json=await rsp.json();if(seq!==remoteSearchSeq)return;
  const products=(json.products||[]).filter(x=>x.product_name&&x.nutriments).map(x=>{
   const n=x.nutriments;
   const kcal=Number(n['energy-kcal_100g']??(Number.isFinite(Number(n['energy-kj_100g']))?Number(n['energy-kj_100g'])/4.184:NaN));
   const p=Number(n.proteins_100g),c=Number(n.carbohydrates_100g),f=Number(n.fat_100g);
   if(![kcal,p,c,f].every(v=>Number.isFinite(v)&&v>=0)||kcal>1000||p>100||c>100||f>100)return null;
   const serving=Number.parseFloat(String(x.serving_size||'').replace(',','.'));const usableServing=/\bg\b/i.test(x.serving_size||'')&&Number.isFinite(serving)&&serving>0&&serving<=2000;
   return {id:'off-'+x.code,name:(x.brands?x.brands+' · ':'')+x.product_name,kcal,p,c,f,origin:'Open Food Facts (topluluk)',servingGrams:usableServing?serving:null};
  }).filter(Boolean);
  remoteFoods=products;remoteSearchState=products.length?'':'Açık ürün veritabanında uygun sonuç yok.';
 }catch(e){if(seq!==remoteSearchSeq)return;remoteFoods=[];remoteSearchState='Çevrim içi arama şu anda kullanılamıyor. Yerel besinleri veya FatSecret bağlantısını kullan.';}
 renderFoodSearchOnly();
}

   if(fromPlan){day.meals[slot]={mode:'done',portion:Number(e[0]?.portion||1)*100};continue;}
   if(st==='alternative'||e.length){
    const noteRow=e.find(x=>x.kcal==null);
    const items=e.filter(x=>x.kcal!=null).map(x=>{
     const g=Number(x.grams??100)||100,ratio=100/g;
     return {id:x.id,name:x.name,grams:g,kcal:x.base_kcal!=null?Number(x.base_kcal):Number(x.kcal||0)*ratio,p:x.base_p!=null?Number(x.base_p):Number(x.p||0)*ratio,c:x.base_c!=null?Number(x.base_c):Number(x.c||0)*ratio,f:x.base_f!=null?Number(x.base_f):Number(x.f||0)*ratio,origin:x.source||'Manuel',...itemUnit(x)};
    });
    day.meals[slot]={mode:'custom',items,note:stripUnitNote(noteRow?.note||e.find(x=>stripUnitNote(x.note))?.note||'')};
   }
  }
  day.extras=byslot('extra').filter(x=>x.kcal!=null).map(x=>{
   const g=Number(x.grams??100)||100,ratio=100/g;
   return {id:x.id,name:x.name,grams:g,kcal:x.base_kcal!=null?Number(x.base_kcal):Number(x.kcal||0)*ratio,p:x.base_p!=null?Number(x.base_p):Number(x.p||0)*ratio,c:x.base_c!=null?Number(x.base_c):Number(x.c||0)*ratio,f:x.base_f!=null?Number(x.base_f):Number(x.f||0)*ratio,origin:x.source||'Manuel',...itemUnit(x)};
  });
  const log=tables.day_logs.find(x=>x.log_date===date);
  if(log){day.metrics={water:log.water_ml,steps:log.steps,sleep:log.sleep_h,weight:log.weight_kg};day.note=log.notes||'';}
  s.days[date]=day;
 }
 const current=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 s.selected=current.startsWith('2026-11-')?current:'2026-11-30';
 return s;
}
async function load(){
 busy=true;status('Buluttan veriler yükleniyor…');
 try{
  await ensureAuth();
  const names=['user_settings','food_entries','meal_status','day_logs','custom_foods'];
  const values=await Promise.all(names.map(n=>rows(n)));
  const obj=Object.fromEntries(names.map((n,i)=>[n,values[i]]));
  state=convertIn(obj);snapshot=deep(state);ready=true;busy=false;
  authBox.hidden=true;document.querySelector('#app').hidden=false;
  render();status('✓ Buluta bağlı');
 }catch(e){busy=false;ready=false;status('Bağlantı sorunu',true);throw e;}
}
async function saveSlot(date,slot,rec){
 const q='user_id=eq.'+encodeURIComponent(session.user.id)+'&log_date=eq.'+date+'&slot=eq.'+slot;
 // Delete and recreate only the edited meal slot, not all the user's historical records.
 await db('food_entries','DELETE',q);
 await db('meal_status','DELETE',q);
 if(!rec||rec.mode==='pending')return;
 const user_id=session.user.id;let statusVal='alternative';const entries=[];
 if(rec.mode==='skipped')statusVal='skipped';
 else if(rec.mode==='done'){
  statusVal='eaten';const p=PLAN.find(x=>x.date===date)?.meals.find(x=>x.id===slot);
  if(p){const portion=(Number(rec.portion)||100)/100;
   entries.push({user_id,log_date:date,slot,name:p.desc,grams:null,portion,kcal:p.kcal*portion,p:p.p*portion,c:p.c*portion,f:p.f*portion,base_kcal:p.kcal,base_p:p.p,base_c:p.c,base_f:p.f,source:'plan',plan_code:'plan-'+date+'-'+slot,note:null});
  }
 }else if(rec.mode==='custom'){
  for(const x of rec.items||[])entries.push(makeItem(x,date,slot));
  if(!entries.length)entries.push({user_id,log_date:date,slot,name:'Besin değerleri bekleniyor',grams:null,portion:null,kcal:null,p:null,c:null,f:null,base_kcal:null,base_p:null,base_c:null,base_f:null,source:'manual',plan_code:null,note:rec.note||null});
  else if(rec.note)entries[0].note=[entries[0].note,rec.note].filter(Boolean).join('\n');
 }
 if(entries.length)await db('food_entries','POST','',entries);
 await db('meal_status','POST','on_conflict=user_id%2Clog_date%2Cslot',[{user_id,log_date:date,slot,status:statusVal,updated_at:stamp()}]);
}
function makeItem(x,date,slot){
 const g=Number(x.grams)||100,mult=g/100;
 return {user_id:session.user.id,log_date:date,slot,name:x.name,grams:g,portion:null,kcal:Number(x.kcal||0)*mult,p:Number(x.p||0)*mult,c:Number(x.c||0)*mult,f:Number(x.f||0)*mult,base_kcal:Number(x.kcal||0),base_p:Number(x.p||0),base_c:Number(x.c||0),base_f:Number(x.f||0),source:x.origin||'manual',plan_code:null,note:x.unit&&x.unit!=='g'&&x.qty>0 ? `Miktar: ${Number(x.qty)} ${x.unit} (≈${Math.round(g*100)/100} g)` : null};
}
async function saveExtras(date,extras){
 const q='user_id=eq.'+encodeURIComponent(session.user.id)+'&log_date=eq.'+date+'&slot=eq.extra';
 await db('food_entries','DELETE',q);
 if(extras?.length)await db('food_entries','POST','',extras.map(x=>makeItem(x,date,'extra')));
}
async function saveDay(date,day){
 const user_id=session.user.id,log_date=date,m=day.metrics||{};
 const payload={user_id,log_date,steps:m.steps??null,water_ml:m.water??null,sleep_h:m.sleep??null,weight_kg:m.weight??null,notes:day.note||null,updated_at:stamp()};
 await db('day_logs','POST','on_conflict=user_id%2Clog_date',[payload]);
}
async function saveSettings(s){
 const user_id=session.user.id;
 await db('user_settings','POST','on_conflict=user_id',[{user_id,workout_kcal:s.train,rest_kcal:s.rest,workout_p:s.protein,rest_p:s.protein,workout_c:s.trainC,rest_c:s.restC,workout_f:s.fat,rest_f:s.fat,updated_at:stamp()}]);
}
async function saveFoods(previous,current){
 const prevIds=new Set(previous.map(x=>x.id)),nowIds=new Set(current.map(x=>x.id));
 for(const x of previous){if(!nowIds.has(x.id)&&/^[0-9a-f-]{36}$/i.test(x.id))await db('custom_foods','DELETE','id=eq.'+encodeURIComponent(x.id)+'&user_id=eq.'+encodeURIComponent(session.user.id));}
 for(const x of current){if(prevIds.has(x.id))continue;const id=/^[0-9a-f-]{36}$/i.test(x.id)?x.id:crypto.randomUUID();x.id=id;
  await db('custom_foods','POST','',[{id,user_id:session.user.id,name:x.name,brand:x.brand||null,kcal_100:x.kcal,p_100:x.p,c_100:x.c,f_100:x.f,source:'manual',note:null}]);
 }
}
async function writeDelta(old,current){
 if(!same(old.settings,current.settings))await saveSettings(current.settings);
 if(!same(old.customFoods,current.customFoods))await saveFoods(old.customFoods,current.customFoods);
 for(const date of Object.keys({...old.days,...current.days})){
  const was=old.days[date]||{meals:{},extras:[],metrics:{},note:''};const now=current.days[date]||{meals:{},extras:[],metrics:{},note:''};
  for(const slot of slots.filter(x=>x!=='extra')){
   if(!same(was.meals?.[slot],now.meals?.[slot]))await saveSlot(date,slot,now.meals?.[slot]);
  }
  if(!same(was.extras,now.extras))await saveExtras(date,now.extras);
  if(!same(was.metrics,now.metrics)||was.note!==now.note)await saveDay(date,now);
 }
}
function persist(){
 if(!ready||!session)return;
 const old=deep(snapshot||empty()),cur=deep(state);
 if(same(old,cur))return;
 snapshot=cur;busy=true;status('☁ Kaydediliyor…');
 queue=queue.catch(()=>{}).then(async()=>{
  await writeDelta(old,cur);busy=false;status('✓ Buluta kaydedildi');
 }).catch(e=>{busy=false;if(same(snapshot,cur))snapshot=old;status('⚠ Kaydedilemedi: '+e.message,true);console.error('FORMA sync',e);});
}
function decorate(){
 if(!ready)return;
 const target=document.querySelector('.topactions');
 if(target){
  const wrap=document.createElement('div');wrap.className='cloud-controls';
  wrap.innerHTML='<span class="sync-indicator" id="cloudStatus">✓ Buluta bağlı</span><button class="btn btn-outline btn-sm" id="cloudSignOut" type="button">Çıkış</button><button class="btn btn-outline btn-sm" id="cloudTheme" type="button" aria-label="Temayı değiştir">☼</button>';
  target.prepend(wrap);
  wrap.querySelector('#cloudSignOut').addEventListener('click',logout);
  wrap.querySelector('#cloudTheme').addEventListener('click',()=>{setTheme(document.documentElement.dataset.mode==='dark'?'light':'dark')});
  if(errorText){status('⚠ Kaydetme hatası',true);const retry=document.createElement('button');retry.type='button';retry.className='btn btn-outline btn-sm';retry.textContent='Tekrar dene';retry.onclick=()=>persist();wrap.append(retry)}else if(busy)status('☁ Kaydediliyor…');
 }
 const set=document.querySelector('.settings');
 if(set){const el=document.createElement('section');el.className='card theme-settings';
  el.innerHTML='<h3>🎨 Görünüm</h3><p>Uygulamanın renklerini seç.</p><div class="theme-options"><button data-theme-select="light">☀ Açık</button><button data-theme-select="dark">☾ Koyu</button><button data-theme-select="system">▣ Sistem</button></div>';
  set.prepend(el);
  el.querySelectorAll('[data-theme-select]').forEach(b=>{b.onclick=()=>{setTheme(b.dataset.themeSelect);render()};b.classList.toggle('on',b.dataset.themeSelect===(localStorage.getItem('forma-theme')||'dark'));});
 }
}
function setTheme(mode){localStorage.setItem('forma-theme',mode);document.documentElement.dataset.mode=mode;applyTheme();}
function applyTheme(){const mode=document.documentElement.dataset.mode||'dark';document.documentElement.dataset.theme=mode==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',document.documentElement.dataset.theme==='dark'?'#101b25':'#f5f6f6');}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
setTheme(localStorage.getItem('forma-theme')||'dark');
async function login(ev){
 ev.preventDefault();const email=document.querySelector('#authEmail').value.trim(),password=document.querySelector('#authPassword').value;
 const signup=ev.submitter?.dataset.signup==='true';notify('Bağlanılıyor…');
 try{
  const r=await authRequest(signup?'signup':'token?grant_type=password',{email,password});
  if(!r.access_token){notify('Hesabını doğrulamak için e-postana gelen bağlantıyı aç.');return;}
  session=r;session.expires_at=Math.floor(Date.now()/1000)+(r.expires_in||3600);
  localStorage.setItem(AUTH_KEY,JSON.stringify(session));await load();
 }catch(e){notify('Giriş yapılamadı: '+e.message);}
}
async function logout(){
 if(!confirm('FORMA hesabından çıkış yapmak istiyor musun?'))return;
 await queue.catch(()=>{});
 try{await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+access()}})}catch{}
 localStorage.removeItem(AUTH_KEY);session=null;ready=false;snapshot=null;state=empty();
 document.querySelector('#app').hidden=true;authBox.hidden=false;notify('Çıkış yapıldı.');
}
async function start(){
 document.querySelector('#authForm').addEventListener('submit',login);
 document.querySelector('#authSignup').onclick=ev=>login({preventDefault:()=>{},submitter:ev.target});
 document.querySelector('#app').hidden=true;authBox.hidden=false;
 try{const stored=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(stored?.refresh_token){session=stored;await load();}}
 catch(e){localStorage.removeItem(AUTH_KEY);session=null;ready=false;notify('Oturum sona erdi. Yeniden giriş yap.');}
}
start();
})();
